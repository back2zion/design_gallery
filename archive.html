                    {theme==='dark'
                      ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" stroke={ic} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      : <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke={ic} strokeWidth="1.8"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke={ic} strokeWidth="1.8" strokeLinecap="round"/></svg>
                    }
                  </button>
                  <div className="relative">
                    <button onClick={() => setLangOpen(!langOpen)} className="flex items-center gap-1.5 h-9 px-3 rounded-full border border-white/15 bg-white/5 hover:bg-white/10 transition text-sm text-white/75 font-medium">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" stroke={icm} strokeWidth="1.8"/>
                        <path d="M12 3C12 3 9 7 9 12C9 17 12 21 12 21" stroke={icm} strokeWidth="1.8" strokeLinecap="round"/>
                        <path d="M12 3C12 3 15 7 15 12C15 17 12 21 12 21" stroke={icm} strokeWidth="1.8" strokeLinecap="round"/>
                        <path d="M3 12H21" stroke={icm} strokeWidth="1.8" strokeLinecap="round"/>
                      </svg>
                      {lang==='ko'?'KR':lang==='en'?'EN':'JA'}
                      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 4.5L6 7.5L9 4.5" stroke={icm} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </button>
                    {langOpen && (
                      <div className="family-site-dropdown absolute right-0 top-full mt-1 w-36 rounded-lg border border-white/15 overflow-hidden z-50">
                        {[['ko','한국어'],['en','English'],['ja','日本語']].map(([code, label]) => (
                          <button key={code} className="block w-full text-left px-4 py-2.5 text-sm text-white/60 hover:bg-white/10 hover:text-white/90 transition" onClick={() => changeLang(code)}>
                            {label}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <section className="mx-auto max-w-7xl px-4 sm:px-8 py-12 sm:py-20">
              <div className="mb-8 flex items-end justify-between">
                <div>
                  <p className="page-header-label">Clients</p>
                  <h1 className="mt-2 text-2xl sm:text-3xl font-bold">{t.pageHeading}</h1>
                  <p style={{marginTop:'8px', fontSize:'14px', color:theme==='dark'?'rgba(255,255,255,0.4)':'rgba(9,30,66,0.45)'}}>{t.pageSub}</p>
                </div>
              </div>

              {/* Grid */}
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(240px, 1fr))', gap:'20px'}}>
                {archiveItems.map((item, index) => (
                  <div
                    key={item.id}
                    onClick={() => setSelectedArchiveIndex(index)}
                    style={{
                      borderRadius:'16px',
                      border:`1px solid ${theme==='dark'?'rgba(255,255,255,0.08)':'rgba(9,30,66,0.1)'}`,
                      background:theme==='dark'?'rgba(255,255,255,0.03)':'#FFFFFF',
                      overflow:'hidden',
                      cursor:'pointer',
                      transition:'all 0.2s ease',
                    }}
                    onMouseEnter={e=>{
                      e.currentTarget.style.transform='translateY(-4px)';
                      e.currentTarget.style.borderColor=theme==='dark'?'rgba(255,255,255,0.15)':'rgba(9,30,66,0.2)';
                      e.currentTarget.style.boxShadow=theme==='dark'?'0 8px 32px rgba(0,0,0,0.3)':'0 4px 12px rgba(9,30,66,0.1)';
                    }}
                    onMouseLeave={e=>{
                      e.currentTarget.style.transform='';
                      e.currentTarget.style.borderColor=theme==='dark'?'rgba(255,255,255,0.08)':'rgba(9,30,66,0.1)';
                      e.currentTarget.style.boxShadow='none';
                    }}>
                    <div style={{
                      aspectRatio:'1',
                      background:`linear-gradient(135deg, ${item.color} 0%, ${item.color}cc 100%)`,
                      display:'flex',
                      alignItems:'center',
                      justifyContent:'center',
                      overflow:'hidden',
                    }}>
                      <img
                        src={item.logo}
                        alt={L(item, 'client')}
                        style={{maxWidth:'60%', maxHeight:'60%', objectFit:'contain'}}
                        onError={e => { e.currentTarget.style.display='none'; }}
                      />
                    </div>
                    <div style={{padding:'14px 16px'}}>
                      <div style={{fontSize:'11px', fontWeight:'600', color:theme==='dark'?'rgba(255,255,255,0.5)':'rgba(9,30,66,0.5)', marginBottom:'4px', textTransform:'uppercase', letterSpacing:'0.04em'}}>{L(item, 'client')}</div>
                      <h3 style={{fontSize:'13px', fontWeight:'600', color:theme==='dark'?'rgba(255,255,255,0.9)':'#172B4D', lineHeight:'1.4', marginBottom:'8px'}}>{L(item, 'title')}</h3>
                      <div style={{display:'flex', gap:'6px', flexWrap:'wrap'}}>
                        <span className={`gallery-badge ${INDUSTRY_CLS[item.industry] || ''}`} style={{fontSize:'9px'}}>{t.labels[item.industry] || item.industry}</span>
                        <span className={`gallery-badge ${SCREEN_CLS[item.screenType] || ''}`} style={{fontSize:'9px'}}>{item.screenType}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Popup */}
            {selectedArchive && (
              <div className="archive-popup-overlay" onClick={(e) => { if (e.target === e.currentTarget) setSelectedArchiveIndex(null); }}>
                <div className="archive-popup" role="dialog" aria-modal="true" aria-labelledby="archive-popup-title">
                  <div className="archive-popup-controls">
                    <button type="button" className="archive-popup-action" onClick={() => moveArchiveIndex(-1)} aria-label={t.ariaPrev}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 18L9 12L15 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </button>
                    <button type="button" className="archive-popup-action" onClick={() => moveArchiveIndex(1)} aria-label={t.ariaNext}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </button>
                    <button type="button" className="archive-popup-action archive-popup-close" onClick={() => setSelectedArchiveIndex(null)} aria-label={t.ariaClose}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                      </svg>
                    </button>
                  </div>
                  <div className="archive-popup-left">
                    <img src={selectedArchive.back} alt={L(selectedArchive, 'title')} />
                  </div>
                  <div className="archive-popup-right">
                    <div className="archive-popup-content">
                      <div>
                        <h3 id="archive-popup-title" className="archive-popup-title">{L(selectedArchive, 'title')}</h3>
                        <div className="archive-popup-meta">
                          <div className="archive-popup-meta-item"><strong>{t.metaClient}</strong><span>{L(selectedArchive, 'client')}</span></div>
                          <div className="archive-popup-meta-item"><strong>{t.metaProject}</strong><span>{L(selectedArchive, 'projectName')}</span></div>
                          <div className="archive-popup-meta-item"><strong>{t.metaIndustry}</strong><span>{t.labels[selectedArchive.industry] || selectedArchive.industry}</span></div>
                          <div className="archive-popup-meta-item"><strong>{t.metaScreenType}</strong><span>{selectedArchive.screenType}</span></div>
                          {selectedArchive.layoutType && <div className="archive-popup-meta-item"><strong>{t.metaLayout}</strong><span>{L(selectedArchive, 'layoutType')}</span></div>}
                          {selectedArchive.suitableFor && <div className="archive-popup-meta-item"><strong>{t.metaPurpose}</strong><span>{L(selectedArchive, 'suitableFor')}</span></div>}
                          {selectedArchive.description && <div className="archive-popup-meta-item"><strong>{t.metaDescription}</strong><span>{L(selectedArchive, 'description')}</span></div>}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Footer */}
          <footer className="site-footer">
            {/* Footer Top */}
            <div className="mx-auto max-w-7xl px-8 py-10">
              <div className="flex items-start justify-between gap-8">

                {/* Left: Company Info + Nav links */}
                <div className="flex flex-col gap-6">
                {/* Company Info */}
                <div className="flex flex-col gap-1.5 text-xs text-white/35 leading-relaxed">
                  <p className="text-white/50 font-medium text-sm">{t.company}</p>
                  <p>{t.address} &nbsp;|&nbsp; {t.ceo}</p>
                  <p>Tel: 02-561-4475 &nbsp;|&nbsp; Fax: 02-561-4479</p>
                  <p>문의 : hhpark1425@bimatrix.co.kr</p>
                  <p className="mt-1">© BI MATRIX CO., LTD. ALL RIGHTS RESERVED.</p>
                </div>

                </div>

                {/* Right: Family Site Dropdown */}
                <div className="relative flex-shrink-0">
                  <button onClick={() => setFamilySiteOpen(!familySiteOpen)}
                    className="flex items-center gap-2 rounded-lg border border-white/15 bg-white/5 px-4 py-2.5 text-sm text-white/70 hover:bg-white/10 transition min-w-[160px] justify-between">
                    <span>Family Site</span>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                        className={`family-site-chevron ${familySiteOpen ? 'open' : ''}`}>
                      <path d="M3 4.5L6 7.5L9 4.5" stroke="rgba(255,255,255,0.5)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </button>
                      {familySiteOpen && (
                        <div className="family-site-dropdown absolute right-0 bottom-full mb-1 w-48 rounded-lg border border-white/15 overflow-hidden z-10">
                          {[
                            {label: t.familySites[0], href: "https://www.bimatrix.co.kr/"},
                            {label: t.familySites[1], href: "https://audp.bimatrix.co.kr/"},
                            {label: t.familySites[2], href: "http://aud.bimatrix.co.kr/extention/sso/SimpleSSO4.jsp"},
                            {label: t.familySites[3], href: "https://cs.bimatrix.co.kr/"},
                          ].map((item) => (
                            <a key={item.href} href={item.href} target="_blank"
                              className="block px-4 py-2.5 text-sm text-white/60 hover:bg-white/10 hover:text-white/90 transition">
                              {item.label}
                            </a>
                          ))}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Footer Bottom */}
            <div className="footer-bottom">
              <div className="mx-auto max-w-7xl px-8 py-6 flex items-end justify-between gap-8" style={{ marginTop: "-2.5rem" }}>
                {/* Nav Links */}
                <div className="flex items-center gap-6 text-sm text-white/50">
                  <a href="https://www.bimatrix.co.kr/privacy/" target="_blank" className="hover:text-white/80 transition">
                    {t.footerPrivacy}</a>
                </div>
                {/* BI MATRIX Logo */}
                <div className="flex-shrink-0">
                  <img
                    src="images/img_logo_footer.svg"
                    alt="BI MATRIX"
                    className="footer-logo"
                  />
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ArchivePage />);
  </script>
</body>
</html>

function IconSvg({ paths, size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
      {paths.map((d, i) => <path key={i} d={d} />)}

/* ── Color Panel ─────────────────────────────────────────── */
function ColorPanel({ showToast, lang }) {
  const t = I18N[lang];
  const [themeFilter, setThemeFilter] = React.useState('all');
  const [clientFilter, setClientFilter] = React.useState('전체');
  const [selectedId, setSelectedId] = React.useState(null);

  const filtered = COLOR_THEMES.filter(th => {
    if (themeFilter !== 'all' && th.theme !== themeFilter) return false;
    if (clientFilter !== '전체' && th.clientCat !== clientFilter) return false;
    return true;
  });

  const selectedTheme = selectedId ? COLOR_THEMES.find(th => th.id === selectedId) : null;

  const copy = (hex) => {
    navigator.clipboard.writeText(hex).catch(() => {});
    showToast(t.hexCopied(hex));
  };

  const handleCardClick = (id) => {
    setSelectedId(prev => prev === id ? null : id);
  };

  const handleFilterChange = (setter, val) => {
    setter(val);
    setSelectedId(null);
  };

  return (
    <div className="gallery-layout">
      <aside className="lnb">
        <nav className="lnb-section">
          <p className="lnb-section-title">Theme</p>
          {THEME_FILTERS.map(({ val, label }) => (
            <button key={val}
              className={`filter-btn ${themeFilter === val ? 'active' : ''}`}
              onClick={() => handleFilterChange(setThemeFilter, val)}>
              {val === 'all' ? t.all : label}
            </button>
          ))}
        </nav>
        <nav className="lnb-section">
          <p className="lnb-section-title">Client</p>
          {CLIENT_FILTERS.map(c => (
            <button key={c}
              className={`filter-btn ${clientFilter === c ? 'active' : ''}`}
              onClick={() => handleFilterChange(setClientFilter, c)}>
              {c === '전체' ? t.all : (t.clientCats[c] || c)}
            </button>
          ))}
        </nav>
      </aside>

      <main className="gallery-main">
        <p className="result-count">{t.themeCount(filtered.length)}</p>

        <div className="theme-card-grid">
          {filtered.map(th => (
            <div key={th.id}
              className={`theme-card ${selectedId === th.id ? 'selected' : ''}`}
              onClick={() => handleCardClick(th.id)}>
              <div className="theme-card-strip">
                {th.brand.map(c => (
                  <div key={c.name} className="theme-card-strip-seg" style={{ backgroundColor: c.hex }} />
                ))}
              </div>
              <div className="theme-card-body">
                <div className="theme-card-badges">
                  <span className={`theme-badge-pill ${th.theme}`}>
                    {th.theme === 'cool' ? 'Cool' : 'Warm'}
                  </span>
                  <span className="client-cat-pill">{t.clientCats[th.clientCat] || th.clientCat}</span>
                </div>
                <div className="theme-card-name">{th.name}</div>
              </div>
            </div>
          ))}
        </div>

        {selectedTheme && (
          <ColorModal
            theme={selectedTheme}
            onClose={() => setSelectedId(null)}
            showToast={showToast}
            t={t}
            lang={lang}
          />
        )}
      </main>
    </div>
  );
}

/* ── Chart Preview ───────────────────────────────────────── */
function ChartPreview({ chartId }) {
  const P = '#7D60FF', S = '#2B67FF', A = '#63E4B9';
  const ax = 'rgba(255,255,255,0.14)';
  const gr = 'rgba(255,255,255,0.05)';
  // viewBox 0 0 400 200: x 15-385, y-bottom 185
  const sp = { viewBox: '0 0 400 200', width: '100%', style: { display: 'block' } };

  const arcPath = (cx, cy, R, r, s, e) => {
    const rad = d => (d - 90) * Math.PI / 180;
    const c = Math.cos, sn = Math.sin;
    const [a0, a1] = [rad(s), rad(e)];
    const lg = e - s > 180 ? 1 : 0;
    const f = n => n.toFixed(2);
    return `M${f(cx+R*c(a0))},${f(cy+R*sn(a0))} A${R},${R},0,${lg},1,${f(cx+R*c(a1))},${f(cy+R*sn(a1))} L${f(cx+r*c(a1))},${f(cy+r*sn(a1))} A${r},${r},0,${lg},0,${f(cx+r*c(a0))},${f(cy+r*sn(a0))} Z`;
  };

  if (chartId === 1) return ( // Bar Chart — 6 bars
    <svg {...sp}>
      {[55,100,145].map(y => <line key={y} x1="15" x2="385" y1={y} y2={y} stroke={gr} strokeWidth="1"/>)}
      <line x1="15" y1="185" x2="385" y2="185" stroke={ax} strokeWidth="1"/>
      {[118,80,155,60,108,85].map((h, i) => (
        <rect key={i} x={36+i*57} y={185-h} width="44" height={h} rx="3"
          fill={i===2 ? A : P} fillOpacity={i===2 ? 0.82 : 0.65}/>
      ))}
    </svg>
  );

  if (chartId === 2) return ( // Stacked Bar Chart — 5 bars × 3 segments
    <svg {...sp}>
      <line x1="15" y1="185" x2="385" y2="185" stroke={ax} strokeWidth="1"/>
      {[[50,72,32],[42,65,44],[58,68,35],[45,55,52],[52,64,30]].map((segs, i) => {
        let y = 185;
        return (
          <g key={i}>
            {[P,S,A].map((col, j) => {
              const h = segs[j]; y -= h;
              return <rect key={j} x={44+i*66} y={y} width="48" height={h} rx={j===2?3:0} fill={col} fillOpacity="0.72"/>;
            })}
          </g>
        );
      })}
    </svg>
  );

  if (chartId === 3) return ( // Line Chart — 2 series
    <svg {...sp}>
      {[55,100,145].map(y => <line key={y} x1="15" x2="385" y1={y} y2={y} stroke={gr} strokeWidth="1"/>)}
      <line x1="15" y1="185" x2="385" y2="185" stroke={ax} strokeWidth="1"/>
      <polyline points="25,148 80,108 135,122 192,62 248,82 305,42 375,65"
        fill="none" stroke={P} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {[[25,148],[80,108],[135,122],[192,62],[248,82],[305,42],[375,65]].map(([x,y],i)=>(
        <circle key={i} cx={x} cy={y} r="4" fill={P}/>
      ))}
      <polyline points="25,165 80,136 135,150 192,108 248,120 305,92 375,112"
        fill="none" stroke={A} strokeWidth="2" strokeDasharray="7,4"
        strokeLinejoin="round" strokeLinecap="round" strokeOpacity="0.6"/>
    </svg>
  );

  if (chartId === 4) return ( // Area Chart
    <svg {...sp}>
      {[60,110].map(y => <line key={y} x1="15" x2="385" y1={y} y2={y} stroke={gr} strokeWidth="1"/>)}
      <line x1="15" y1="185" x2="385" y2="185" stroke={ax} strokeWidth="1"/>
      <defs>
        <linearGradient id="cpag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={P} stopOpacity="0.42"/>
          <stop offset="100%" stopColor={P} stopOpacity="0.02"/>

const TABS = [
  { id: 'chart', label: 'Chart' },
  { id: 'font',  label: 'Font'  },
  { id: 'color', label: 'Color' },
];

function ResourcesPage() {
  const getInitialResourceTab = () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const tabFromQuery = params.get('tab');
      const tabFromHash = window.location.hash ? window.location.hash.replace('#', '') : '';
      const nextTab = (tabFromQuery || tabFromHash || 'chart').toLowerCase();
      return TABS.some(tab => tab.id === nextTab) ? nextTab : 'chart';
    } catch (e) {
      return 'chart';
    }
  };
  const [activeTab,       setActiveTab]       = React.useState(getInitialResourceTab);
  const changeActiveTab = (tabId) => {
    setActiveTab(tabId);
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('tab', tabId);
      url.hash = '';
      window.history.replaceState(null, '', url.toString());
    } catch (e) {}
  };
  const [theme, setTheme] = React.useState(() => { try{return localStorage.getItem('axis-theme')||'dark';}catch(e){return 'dark';} });
  React.useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const toggleTheme = () => { const n=theme==='dark'?'light':'dark'; setTheme(n); try{localStorage.setItem('axis-theme',n);}catch(e){} };
  const [lang, setLang] = React.useState(() => { try{return localStorage.getItem('axis-lang')||'ko';}catch(e){return 'ko';} });
  const [langOpen, setLangOpen] = React.useState(false);
  React.useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  const changeLang = (l) => { setLang(l); setLangOpen(false); try{localStorage.setItem('axis-lang', l);}catch(e){} };
  const t = I18N[lang];
  React.useEffect(() => { document.title = t.pageTitle; }, [lang]);
  const ic  = theme==='dark' ? 'rgba(255,255,255,0.75)' : 'rgba(9,30,66,0.55)';

        </div>

          <p className="page-header-label">Resources</p>

        </div>
      </div>

      {/* Tab Nav */}
      <div className="mx-auto max-w-7xl px-8">
        <div role="tablist" className="resource-tab-nav">
          {TABS.map(tab => (
            <button key={tab.id}

              aria-selected={activeTab === tab.id}

              onClick={() => changeActiveTab(tab.id)}>

      </div>

      {/* Tab Content */}
      <div className="mx-auto max-w-7xl px-8 py-10">
        {activeTab === 'color' && <ColorPanel showToast={showToast} lang={lang} />}
        {activeTab === 'chart' && <ChartPanel lang={lang} />}
        {activeTab === 'font'  && <FontPanel  showToast={showToast} lang={lang} />}
        {activeTab === 'icon'  && <IconPanel  showToast={showToast} lang={lang} />}

                  <p>{t.address} &nbsp;|&nbsp; {t.ceo}</p>
                  <p>Tel: 02-561-4475 &nbsp;|&nbsp; Fax: 02-561-4479</p>

                        className={`family-site-chevron ${familySiteOpen ? 'open' : ''}`}>
                      <path d="M3 4.5L6 7.5L9 4.5" stroke="rgba(255,255,255,0.5)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </button>
                      {familySiteOpen && (
                        <div className="family-site-dropdown absolute right-0 bottom-full mb-1 w-48 rounded-lg border border-white/15 overflow-hidden z-10">
                          {[
                            {label: t.familySites[0], href: "https://www.bimatrix.co.kr/"},
                            {label: t.familySites[1], href: "https://audp.bimatrix.co.kr/"},
                            {label: t.familySites[2], href: "http://aud.bimatrix.co.kr/extention/sso/SimpleSSO4.jsp"},
                            {label: t.familySites[3], href: "https://cs.bimatrix.co.kr/"},
                          ].map((item) => (
                            <a key={item.href} href={item.href} target="_blank"
                              className="block px-4 py-2.5 text-sm text-white/60 hover:bg-white/10 hover:text-white/90 transition">
                              {item.label}
                            </a>
                          ))}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Footer Bottom */}
            <div className="footer-bottom">
              <div className="mx-auto max-w-7xl px-8 py-6 flex items-end justify-between gap-8" style={{ marginTop: "-2.5rem" }}>
                {/* Nav Links */}
                <div className="flex items-center gap-6 text-sm text-white/50">
                  <a href="https://www.bimatrix.co.kr/privacy/" target="_blank" className="hover:text-white/80 transition">
                    {t.footerPrivacy}</a>
                </div>
                {/* BI MATRIX Logo */}
                <div className="flex-shrink-0">
                  <img
                    src="images/img_logo_footer.svg"
                    alt="BI MATRIX"
                    className="footer-logo"
                  />
                </div>
              </div>
            </div>
          </footer>

      {/* Toast */}
      {toast && <div className="toast">{toast}</div>}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ResourcesPage />);
</script>

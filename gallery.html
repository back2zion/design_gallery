    function FilterDropdown({ label, value, options, open, onToggle, onSelect, format }) {
      const fmt = format || ((v) => v);
      const ref = React.useRef(null);
      const [focusIdx, setFocusIdx] = React.useState(0);

      React.useEffect(() => {
        if (!open) return;
        const onKey = (e) => {
          if (e.key === 'Escape') { onToggle(); }
          if (e.key === 'ArrowDown') { e.preventDefault(); setFocusIdx(i => Math.min(i + 1, options.length - 1)); }
          if (e.key === 'ArrowUp') { e.preventDefault(); setFocusIdx(i => Math.max(i - 1, 0)); }
          if (e.key === 'Enter') { e.preventDefault(); onSelect(options[focusIdx]); }
        };
        const onDocClick = (ev) => { if (ref.current && !ref.current.contains(ev.target)) onToggle(); };
        document.addEventListener('keydown', onKey);
        document.addEventListener('click', onDocClick);
        return () => { document.removeEventListener('keydown', onKey); document.removeEventListener('click', onDocClick); };
      }, [open, options, focusIdx]);

      return (
        <div className="filter-dropdown" ref={ref}>
          <button
            type="button"
            className="filter-dropdown-button"
            onClick={onToggle}
            aria-haspopup="listbox"
            aria-expanded={open}
          >
            <span>{label}</span>
            <span>{fmt(value)} ▾</span>
          </button>
          {open && (
            <div className="filter-dropdown-menu" role="listbox">
              {options.map((option, idx) => (
                <button
                  key={option}
                  type="button"
                  role="option"
                  aria-selected={value === option}
                  className={`filter-dropdown-item ${value === option ? 'active' : ''} ${focusIdx === idx ? 'focused' : ''}`}
                  onMouseEnter={() => setFocusIdx(idx)}
                  onClick={() => onSelect(option)}
                >
                  {fmt(option)}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

      const fl = (value) => t.labels[value] || value;
      const [theme, setTheme] = React.useState(() => { try{return localStorage.getItem('axis-theme')||'dark';}catch(e){return 'dark';} });
      React.useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
      const toggleTheme = () => { const n=theme==='dark'?'light':'dark'; setTheme(n); try{localStorage.setItem('axis-theme',n);}catch(e){} };
      const ic  = theme==='dark' ? 'rgba(255,255,255,0.75)' : 'rgba(9,30,66,0.55)';
      const ics = theme==='dark' ? 'rgba(255,255,255,0.4)'  : 'rgba(9,30,66,0.3)';
      const icm = theme==='dark' ? 'rgba(255,255,255,0.6)'  : 'rgba(9,30,66,0.45)';

      const [selectedIndustry, setSelectedIndustry] = React.useState('전체');
      const [selectedScreen, setSelectedScreen] = React.useState('전체');
      const [selectedPurpose, setSelectedPurpose] = React.useState('전체');
      const [selectedLayout, setSelectedLayout] = React.useState('전체');
      const [selectedTone, setSelectedTone] = React.useState('전체');
      const [openFilter, setOpenFilter] = React.useState(null);
      const [visibleCount, setVisibleCount] = React.useState(PAGE_SIZE);

      const query = searchQuery.trim().toLowerCase();
      const filtered = RAW_DATA.filter(item => {
        const byIndustry = selectedIndustry === '전체' || item.industry === selectedIndustry;
        const byScreen   = selectedScreen   === '전체' || item.screenType === selectedScreen;
        const byPurpose  = selectedPurpose  === '전체' || item.purpose === selectedPurpose;
        const byLayout   = selectedLayout   === '전체' || item.layout === selectedLayout;
        const byTone     = selectedTone     === '전체' || item.tone === selectedTone;
        const bySearch   = !query || [item.title, item.titleEn, item.titleJa, item.industry, item.screenType, item.purpose, item.layout, item.tone]
          .some(value => (value || '').toLowerCase().includes(query));
        return byIndustry && byScreen && byPurpose && byLayout && byTone && bySearch;
      });

      const visible = filtered.slice(0, visibleCount);
      const hasMore = visibleCount < filtered.length;

      const handleScreen   = (f) => { setSelectedScreen(f);   setVisibleCount(PAGE_SIZE); };
      const handlePurpose  = (f) => { setSelectedPurpose(f);  setVisibleCount(PAGE_SIZE); };

                  </svg>

                    placeholder={t.searchPlaceholder}

                  />
                </div>

                      <path d="M12 3C12 3 15 7 15 12C15 17 12 21 12 21" stroke={icm} strokeWidth="1.8" strokeLinecap="round"/>
                      <path d="M3 12H21" stroke={icm} strokeWidth="1.8" strokeLinecap="round"/>
                    </svg>
                    {lang==='ko'?'KR':lang==='en'?'EN':'JA'}
                    <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                      <path d="M3 4.5L6 7.5L9 4.5" stroke={icm} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </button>
                  {langOpen && (
                    <div className="family-site-dropdown absolute right-0 top-full mt-1 w-36 rounded-lg border border-white/15 overflow-hidden z-50">
                      {[['ko','한국어'],['en','English'],['ja','日本語']].map(([code, label]) => (
                        <button

                  onSelect={(value) => { setSelectedScreen(value); setOpenFilter(null); setVisibleCount(PAGE_SIZE); }}

                <FilterDropdown

                  options={PURPOSE_FILTERS}

                  open={openFilter === 'purpose'}

                  onSelect={(value) => { setSelectedPurpose(value); setOpenFilter(null); setVisibleCount(PAGE_SIZE); }}

                <FilterDropdown

                <FilterDropdown

                  options={TONE_FILTERS}
                  format={fl}
                  open={openFilter === 'tone'}
                  onToggle={() => setOpenFilter(openFilter === 'tone' ? null : 'tone')}
                  onSelect={(value) => { setSelectedTone(value); setOpenFilter(null); setVisibleCount(PAGE_SIZE); }}
                />

                <button
                  type="button"
                  className="filter-reset"
                  onClick={() => {
                    setSearchQuery('');
                    setSelectedIndustry('전체');
                    setSelectedScreen('전체');
                    setSelectedPurpose('전체');
                    setSelectedLayout('전체');
                    setSelectedTone('전체');
                    setOpenFilter(null);
                    setVisibleCount(PAGE_SIZE);
                  }}
                >
                  {t.reset}
                </button>
              </div>

              <div className="filter-tag-row">
                {selectedIndustry !== '전체' && (
                  <button type="button" className="filter-tag" onClick={() => setSelectedIndustry('전체')}>
                    {fl(selectedIndustry)} ×
                  </button>
                )}
                {selectedScreen !== '전체' && (
                  <button type="button" className="filter-tag" onClick={() => setSelectedScreen('전체')}>
                    {fl(selectedScreen)} ×
                  </button>
                )}
                {selectedPurpose !== '전체' && (
                  <button type="button" className="filter-tag" onClick={() => setSelectedPurpose('전체')}>
                    {fl(selectedPurpose)} ×
                  </button>
                )}
                {selectedLayout !== '전체' && (
                  <button type="button" className="filter-tag" onClick={() => setSelectedLayout('전체')}>
                    {fl(selectedLayout)} ×
                  </button>
                )}
                {selectedTone !== '전체' && (
                  <button type="button" className="filter-tag" onClick={() => setSelectedTone('전체')}>
                    {fl(selectedTone)} ×
                  </button>
                )}
              </div>
            </section>

            {/* Main */}
            <main className="gallery-main">
              <p className="result-count">
                {t.resultCount(filtered.length)}
              </p>

              {filtered.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-32 text-white/30">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" className="mb-4">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="1.5"/>
                    <path d="M16.5 16.5L21 21" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                  </svg>
                  <p className="text-sm">{t.noResults}</p>
                </div>
              ) : (
                <>
                  <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
                    {visible.map(item => (
                      <GalleryCard key={item.id} item={item} lang={lang} />
                    ))}
                  </div>

                  {hasMore && (
                    <button
                      className="load-more-btn"
                      onClick={() => setVisibleCount(v => v + PAGE_SIZE)}
                    >
                      {t.loadMore(filtered.length - visibleCount)}
                    </button>
                  )}
                </>
              )}
            </main>
          </div>

          <footer className="site-footer">
            <div className="mx-auto max-w-7xl px-8 py-10">

                <div className="flex flex-col gap-6">

                    <a href="https://www.youtube.com/@BIMATRIXKR" target="_blank" rel="noopener noreferrer"
                       className="flex items-center justify-center w-9 h-9 rounded-full border border-white/15 bg-white/5 hover:bg-white/15 transition">
                      <svg viewBox="-1 -1 26 26" aria-hidden="true" focusable="false" fill="rgba(255,255,255,0.65)" width="20">
                        <path d="M 23.498 6.186 a 3.016 3.016 0 0 0 -2.122 -2.136 C 19.505 3.545 12 3.545 12 3.545 s -7.505 0 -9.377 0.505 A 3.017 3.017 0 0 0 0.502 6.186 C 0 8.07 0 12 0 12 s 0 3.93 0.502 5.814 a 3.016 3.016 0 0 0 2.122 2.136 c 1.871 0.505 9.376 0.505 9.376 0.505 s 7.505 0 9.377 -0.505 a 3.015 3.015 0 0 0 2.122 -2.136 C 24 15.93 24 12 24 12 s 0 -3.93 -0.502 -5.814 Z M 9.545 15.568 V 8.432 L 15.818 12 l -6.273 3.568 Z"></path>
                      </svg>
                    </a>
                    <a href="https://www.facebook.com/bimatrixkorea" target="_blank" rel="noopener noreferrer"
                       className="flex items-center justify-center w-9 h-9 rounded-full border border-white/15 bg-white/5 hover:bg-white/15 transition">
                      <svg viewBox="2 2 22 22" aria-hidden="true" focusable="false" fill="rgba(255,255,255,0.65)" width="23">
                        <path d="M13.6 21v-7.1h2.4l.4-3h-2.8V9c0-.87.24-1.47 1.5-1.47H16.5V4.85C16.2 4.81 15.4 4.75 14.47 4.75c-1.95 0-3.28 1.19-3.28 3.38v2.77H9v3h2.19V21h2.41Z"></path>
